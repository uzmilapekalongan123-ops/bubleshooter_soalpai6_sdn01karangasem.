<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter Pintar PAI Mobile</title>
    <style>
        :root {
            --grass-bg: #4caf50;
            --grass-dark: #2e7d32;
            --primary: #1b5e20;
            --card-bg: #ffffff;
            --text: #1b2e1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e8f5e9;
            color: var(--text);
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.2rem;
        }

        header p {
            font-size: 0.8rem;
            color: #555;
        }

        .setup-card {
            background: #f1f8e9;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .setup-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .player-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }

        input, button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #a5d6a7;
            font-size: 0.95rem;
        }

        button {
            background: var(--grass-dark);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 8px;
        }

        button:active {
            background: var(--primary);
        }

        .turn-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ded;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            margin: 0 auto 10px;
            text-align: center;
            touch-action: none;
        }

        canvas {
            background: radial-gradient(circle, var(--grass-bg), var(--grass-dark));
            border: 4px solid #1b4d1d;
            border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            width: 100%;
            height: auto;
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .bonus-badge {
            background: #ffeb3b;
            color: #d81b60;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 8px;
            animation: pulse 1s infinite alternate;
            border: 2px solid #f57f17;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .options-list {
            list-style: none;
            margin: 10px 0;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            background: #f0f4f8;
            color: #333;
            padding: 10px;
            font-size: 0.85rem;
            line-height: 1.2;
        }

        .score-list {
            margin-top: 10px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .player-score {
            background: #e8f5e9;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            border: 1px solid #a5d6a7;
        }

        footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🫧 Bubble Shooter PAI Mobile 🫧</h1>
        <p>Sentuh layar untuk membidik dan menembak!</p>
    </header>

    <div class="setup-card" id="setup-panel">
        <label><strong>Jumlah Pemain:</strong></label>
        <div class="setup-group">
            <input type="number" id="player-count" min="1" max="6" value="2" onchange="generateNameInputs()">
            
            <div id="player-names-container" class="player-inputs"></div>

            <button onclick="initGame()">Mulai Permainan</button>
        </div>
    </div>

    <div id="game-panel" style="display: none;">
        <div class="turn-board">
            <span id="current-turn-display">Giliran: Pemain 1</span>
            <span id="bubbles-left">Sisa: 100</span>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="360" height="480"></canvas>
        </div>

        <h4 style="font-size: 0.9rem;">Skor Pemain:</h4>
        <div class="score-list" id="score-board"></div>
    </div>

    <footer>
        created by uzmila_sdn01karangasem
    </footer>
</div>

<div class="modal" id="quiz-modal">

</div>

    { q: "Jumlah sahabat yang tergolong Khulafaur Rasyidin ada...", a: ["4 orang", "3 orang", "5 orang", "10 orang"], c: 0 },
    { q: "Khalifah pertama pengganti Rasulullah saw. adalah...", a: ["Abu Bakar Ash-Siddiq", "Umar bin Khattab", "Utsman bin Affan", "Ali bin Abi Thalib"], c: 0 },
    { q: "Khalifah yang mendapat gelar 'Al-Faruq' adalah...", a: ["Umar bin Khattab", "Abu Bakar Ash-Siddiq", "Utsman bin Affan", "Ali bin Abi Thalib"], c: 0 },
    { q: "Pembukuan mushaf Al-Qur'an pertama kali dilakukan pada masa khalifah...", a: ["Abu Bakar Ash-Siddiq", "Umar bin Khattab", "Utsman bin Affan", "Ali bin Abi Thalib"], c: 0 },
    { q: "Gelar 'Dzun Nurain' (Pemilik Dua Cahaya) dimiliki oleh khalifah...", a: ["Utsman bin Affan", "Ali bin Abi Thalib", "Abu Bakar Ash-Siddiq", "Umar bin Khattab"], c: 0 },
    { q: "Khalifah yang terkenal sangat cerdas serta merupakan menantu Nabi saw. adalah...", a: ["Ali bin Abi Thalib", "Utsman bin Affan", "Umar bin Khattab", "Abu Bakar Ash-Siddiq"], c: 0 },
    { q: "Penentuan kalender Hijriah dimulai pada masa pemerintahan khalifah...", a: ["Umar bin Khattab", "Abu Bakar Ash-Siddiq", "Utsman bin Affan", "Ali bin Abi Thalib"], c: 0 },
    { q: "Penggandaan standar mushaf Al-Qur'an (Mushaf Usmani) dilakukan oleh khalifah...", a: ["Utsman bin Affan", "Abu Bakar Ash-Siddiq", "Umar bin Khattab", "Ali bin Abi Thalib"], c: 0 },
    { q: "Gelar 'Ash-Siddiq' milik Abu Bakar r.a. berarti...", a: ["Orang yang membenarkan Isra Mikraj", "Pemberani perang", "Pemimpin adil", "Pemilik dua cahaya"], c: 0 }
];

const BUBBLE_COLORS = [
    { name: 'pink', main: '#e91e63', stroke: '#880e4f', text: '#ffffff' },
    { name: 'purple', main: '#9c27b0', stroke: '#4a148c', text: '#ffffff' },
    { name: 'blue', main: '#2196f3', stroke: '#0d47a1', text: '#ffffff' },
    { name: 'cyan', main: '#00bcd4', stroke: '#006064', text: '#ffffff' },
    { name: 'green', main: '#4caf50', stroke: '#1b5e20', text: '#ffffff' },
    { name: 'yellow', main: '#ffeb3b', stroke: '#f57f17', text: '#333333' },
    { name: 'orange', main: '#ff9800', stroke: '#e65100', text: '#ffffff' },
    { name: 'red', main: '#ff5722', stroke: '#bf360c', text: '#ffffff' }
];

const questionsData = rawData.map(item => {
    let optionsWithIndex = item.a.map((optionText, index) => ({
        text: optionText,
        isCorrect: index === item.c
    }));

    for (let i = optionsWithIndex.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
    }

    return {
        q: item.q,
        a: optionsWithIndex.map(o => o.text),
        c: optionsWithIndex.findIndex(o => o.isCorrect)
    };
});

let canvas, ctx;
let players = [];
let currentTurn = 0;
let remainingBubbles = 100;
let activeHitIndex = null;
let isDoubleBonus = false;

const RADIUS = 14;
let gridBubbles = [];
let bullet = null;
let canonAngle = -Math.PI / 2;
let isShooting = false;

function generateNameInputs() {
    const count = parseInt(document.getElementById('player-count').value) || 1;
    const container = document.getElementById('player-names-container');
    container.innerHTML = '';

    for (let i = 0; i < count; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `Nama Pemain ${i + 1}`;
        input.id = `player-name-${i}`;
        input.value = `Pemain ${i + 1}`;
        container.appendChild(input);
    }
}

window.onload = generateNameInputs;

function getRandomColor() {
    return BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
}

function initGame() {
    const count = parseInt(document.getElementById('player-count').value) || 1;
    players = [];

    for (let i = 0; i < count; i++) {
        const nameInput = document.getElementById(`player-name-${i}`);
        const name = nameInput && nameInput.value.trim() !== '' ? nameInput.value.trim() : `Pemain ${i + 1}`;
        players.push({ id: i + 1, name: name, score: 0 });
    }

    currentTurn = 0;
    remainingBubbles = 100;

    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('game-panel').style.display = 'block';

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');

    setupGrid();
    setupBullet();

    // Event Touch/Mouse HP
    canvas.addEventListener('touchmove', handleTouch, { passive: false });
    canvas.addEventListener('touchstart', handleTouch, { passive: false });
    canvas.addEventListener('touchend', shoot, { passive: false });
    canvas.addEventListener('mousemove', trackAim);
    canvas.addEventListener('click', shoot);

    updateBoard();
    requestAnimationFrame(gameLoop);
}

function setupGrid() {
    gridBubbles = [];
    let cols = 10;
    let startX = 22;
    let startY = 22;

    for (let i = 0; i < 100; i++) {
        let col = i % cols;
        let row = Math.floor(i / cols);
        let x = startX + col * (RADIUS * 2 + 5);
        let y = startY + row * (RADIUS * 2 + 5);

        gridBubbles.push({
            id: i,
            x: x,
            y: y,
            active: true,
            color: getRandomColor()
        });
    }
}

function setupBullet() {
    bullet = {
        x: canvas.width / 2,
        y: canvas.height - 25,
        vx: 0,
        vy: 0,
        speed: 9,
        color: getRandomColor()
    };
}

function handleTouch(e) {
    e.preventDefault();
    if (isShooting) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const touchX = (touch.clientX - rect.left) * (canvas.width / rect.width);
    const touchY = (touch.clientY - rect.top) * (canvas.height / rect.height);

    let dx = touchX - bullet.x;
    let dy = touchY - bullet.y;
    canonAngle = Math.atan2(dy, dx);

    if (canonAngle > -0.2) canonAngle = -0.2;
    if (canonAngle < -Math.PI + 0.2) canonAngle = -Math.PI + 0.2;
}

function trackAim(e) {
    if (isShooting) return;
    const rect = canvas.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

    let dx = mouseX - bullet.x;
    let dy = mouseY - bullet.y;
    canonAngle = Math.atan2(dy, dx);

    if (canonAngle > -0.2) canonAngle = -0.2;
    if (canonAngle < -Math.PI + 0.2) canonAngle = -Math.PI + 0.2;
}

function shoot(e) {
    if (e) e.preventDefault();
    if (isShooting) return;
    isShooting = true;
    bullet.vx = Math.cos(canonAngle) * bullet.speed;
    bullet.vy = Math.sin(canonAngle) * bullet.speed;
}

function updateBoard() {
    document.getElementById('current-turn-display').innerText = `Giliran: ${players[currentTurn].name}`;
    document.getElementById('bubbles-left').innerText = `Sisa: ${remainingBubbles}`;

    const scoreBoard = document.getElementById('score-board');
    scoreBoard.innerHTML = '';
    players.forEach(p => {
        const badge = document.createElement('div');
        badge.className = 'player-score';
        badge.innerText = `${p.name}: ${p.score} Poin`;
        scoreBoard.appendChild(badge);
    });
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    gridBubbles.forEach(b => {
        if (b.active) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, RADIUS, 0, Math.PI * 2);
            let grad = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, RADIUS);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(1, b.color.main);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = b.color.stroke;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = b.color.text;
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.id + 1, b.x, b.y);
        }
    });

    if (isShooting) {
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        if (bullet.x - RADIUS <= 0 || bullet.x + RADIUS >= canvas.width) {
            bullet.vx *= -1;
        }

        if (bullet.y - RADIUS <= 0) {
            resetBullet();
        }

        for (let b of gridBubbles) {
            if (b.active) {
                let dist = Math.hypot(bullet.x - b.x, bullet.y - b.y);
                if (dist < RADIUS * 2) {
                    activeHitIndex = b.id;
                    isDoubleBonus = (bullet.color.name === b.color.name);

                    openQuestion(b.id);
                    resetBullet();
                    break;
                }
            }
        }
    }

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height - 25);
    ctx.rotate(canonAngle);
    ctx.fillStyle = '#333';
    ctx.fillRect(0, -5, 30, 10);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, RADIUS, 0, Math.PI * 2);
    let bGrad = ctx.createRadialGradient(bullet.x - 3, bullet.y - 3, 1, bullet.x, bullet.y, RADIUS);
    bGrad.addColorStop(0, '#ffffff');
    bGrad.addColorStop(1, bullet.color.main);
    ctx.fillStyle = bGrad;
    ctx.fill();
    ctx.strokeStyle = bullet.color.stroke;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    requestAnimationFrame(gameLoop);
}

function resetBullet() {
    isShooting = false;
    bullet.x = canvas.width / 2;
    bullet.y = canvas.height - 25;
    bullet.vx = 0;
    bullet.vy = 0;
    bullet.color = getRandomColor();
}

function openQuestion(index) {
    const item = questionsData[index];

    document.getElementById('modal-title').innerText = `Gelembung #${index + 1}`;
    document.getElementById('modal-question').innerText = item.q;

    const bonusBanner = document.getElementById('bonus-banner');
    if (isDoubleBonus) {
        bonusBanner.style.display = 'inline-block';
    } else {
        bonusBanner.style.display = 'none';
    }

    const optionsContainer = document.getElementById('modal-options');
    optionsContainer.innerHTML = '';

    item.a.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
        btn.onclick = () => handleAnswer(idx);
        optionsContainer.appendChild(btn);
    });

    document.getElementById('quiz-modal').style.display = 'flex';
}

function handleAnswer(selectedIndex) {
    document.getElementById('quiz-modal').style.display = 'none';

    const item = questionsData[activeHitIndex];
    if (selectedIndex === item.c) {
        let addedScore = isDoubleBonus ? 2 : 1;
        let bonusText = isDoubleBonus ? "🎉 WARNA SAMA! BONUS 2 POIN!" : "+1 POIN!";
        
        alert(`BENAR! ${players[currentTurn].name} meletuskan Gelembung #${activeHitIndex + 1}!\n\n${bonusText}`);
        
        players[currentTurn].score += addedScore;
        gridBubbles[activeHitIndex].active = false;
        remainingBubbles--;
    } else {
        alert(`SALAH! Gelembung #${activeHitIndex + 1} tidak meletus.`);
    }

    if (remainingBubbles === 0) {
        finishGame();
    } else {
        currentTurn = (currentTurn + 1) % players.length;
        updateBoard();
    }
}

function finishGame() {
    let winner = players.reduce((max, p) => p.score > max.score ? p : max, players[0]);
    alert(`Permainan Selesai!\n\nPemenangnya adalah ${winner.name} dengan ${winner.score} poin!`);
}
</script>
